<svg xmlns="http://www.w3.org/2000/svg" width="900" height="36" viewBox="0 0 900 36" role="img" aria-label="divisor">
<defs>
<linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#555" stop-opacity="0"/><stop offset="1" stop-color="#8a8a8a"/></linearGradient>
<linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#8a8a8a"/><stop offset="1" stop-color="#555" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="lines"><rect x="60" y="17" width="360.0" height="2"/><rect x="480.0" y="17" width="360.0" height="2"/></clipPath>
</defs>
<rect x="60" y="17.5" width="360.0" height="1" fill="url(#l)"/>
<rect x="480.0" y="17.5" width="360.0" height="1" fill="url(#r)"/>
<g clip-path="url(#lines)"><rect x="-120" y="17" width="120" height="2" fill="url(#shine)"><animate attributeName="x" from="-120" to="900" dur="4s" repeatCount="indefinite"/></rect></g>
<g fill="#bdbdbd" transform="translate(450.0,18)">
<rect x="-1.5" y="-12" width="3" height="24" rx="1"/><rect x="-8" y="-6" width="16" height="3" rx="1"/>
</g>
<g fill="#6b6b6b"><rect x="406.0" y="11" width="2" height="14"/><rect x="403.0" y="14" width="8" height="2"/>
<rect x="492.0" y="11" width="2" height="14"/><rect x="489.0" y="14" width="8" height="2"/></g>
</svg>